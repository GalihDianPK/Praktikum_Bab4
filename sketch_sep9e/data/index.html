<!DOCTYPE html>
<html>
<head>
  <title>ESP32 Robot Arm</title>
  <style>
    body { font-family: Arial; text-align: center; }
    input { width: 80%; }
    button { margin-top: 20px; margin-left: 5px; margin-right: 5px; padding: 10px 20px; font-size: 16px; }
    #status { margin-top: 15px; font-weight: bold; color: #333; min-height: 1.2em; }
  </style>
</head>
<body>
  <h2>ESP32 2DOF Robot Arm</h2>

  <p>Base Servo</p>
  <input type="range" min="0" max="180" value="90" id="baseSlider" oninput="updateServo()">

  <p>Shoulder Servo</p>
  <input type="range" min="0" max="180" value="90" id="shoulderSlider" oninput="updateServo()">

  <br><br>
  <button onclick="resetArm()">Reset Arm</button>
  <button id="recordBtn" onclick="record()">Start Recording</button>
  <button onclick="playback()">Playback</button>

  <p id="status"></p>

  <script>
    function updateServo() {
      var base = document.getElementById("baseSlider").value;
      var shoulder = document.getElementById("shoulderSlider").value;
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "/set?base=" + base + "&shoulder=" + shoulder, true);
      xhr.send();
    }

    function resetArm() {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "/reset", true);
      xhr.send();

      // Reset slider positions visually too
      document.getElementById("baseSlider").value = 90;
      document.getElementById("shoulderSlider").value = 90;
    }

    function record() {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "/record", true);
      xhr.onload = function() {
        if (xhr.status === 200) {
          var msg = xhr.responseText;
          document.getElementById("status").innerText = msg;
          document.getElementById("recordBtn").innerText =
            msg.indexOf("started") !== -1 ? "Stop Recording" : "Start Recording";
        }
      };
      xhr.send();
    }

    function playback() {
      document.getElementById("status").innerText = "Playing back...";
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "/playback", true);
      xhr.onload = function() {
        document.getElementById("status").innerText = xhr.responseText;
      };
      xhr.send();
    }
  </script>
</body>
</html>
